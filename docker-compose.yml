version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gts_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gts_bot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: gts_worker
    restart: always
    ports:
      - "5001:5001"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gts_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: gts_bot
      MICROSERVICE_URL: http://worker:5001
    depends_on:
      - db
      - worker

volumes:
  postgres_data:
